<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clip Bench</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="ring-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1>Clip Bench</h1>
    <p class="tag">Paste a link. Pull ten seconds. Ship it vertical.</p>
  </header>

  <main>
    <section class="panel" id="load-panel">
      <label for="url-input">YouTube URL</label>
      <div class="url-row">
        <input id="url-input" type="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" />
        <button id="load-btn">Load</button>
      </div>
      <p class="status" id="load-status"></p>
    </section>

    <section class="panel hidden" id="edit-panel">
      <div class="stage">
        <div class="frame-9x16">
          <video id="preview" playsinline muted></video>
        </div>

        <div class="controls">
          <div class="scrub-row">
            <input id="scrub" type="range" min="0" max="0" step="0.1" value="0" />
          </div>
          <div class="time-row">
            <span id="time-current">0:00</span>
            <span class="clip-window" id="clip-window">clip: 0:00 – 0:10</span>
            <span id="time-total">0:00</span>
          </div>

          <div class="option-row">
            <label class="toggle">
              <input type="checkbox" id="audio-toggle" checked />
              <span>Audio</span>
            </label>
            <button id="clip-btn">Cut clip</button>
          </div>
          <p class="status" id="clip-status"></p>
        </div>
      </div>
    </section>

    <a id="download-link" class="download-link hidden" download="clip.mp4">Download clip.mp4</a>
  </main>

  <script src="app.js"></script>
</body>
</html>
